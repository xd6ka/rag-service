name: tests

# The service tests drive the API with a stub backend: the queue, the cache, the
# percentile maths and the 429 path are all exercised without the RAG pipeline.
# A real answer still needs chromadb and a 3B model, which is exactly why the
# latency numbers in the README are from one machine and not from CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q
